name: App per Mac

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'mappe-mentali/**'
      - 'desktop/**'
      - '.github/workflows/mac-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa le dipendenze
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Costruisci l'app (Apple Silicon e Intel)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac

      - name: Firma ad-hoc e crea i file .dmg
        working-directory: desktop
        run: |
          set -euo pipefail
          make_dmg() {
            local app="$1" out="$2"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            rm -rf staging && mkdir staging
            cp -R "$app" staging/
            ln -s /Applications staging/Applications
            hdiutil create -volname "Mappe Mentali" -srcfolder staging -ov -format UDZO "$out"
          }
          shopt -s nullglob
          found=0
          for app in dist/mac*/*.app; do
            case "$(basename "$(dirname "$app")")" in
              *arm64*) name=AppleSilicon ;;
              *) name=Intel ;;
            esac
            make_dmg "$app" "dist/MappeMentali-$name.dmg"
            found=$((found + 1))
          done
          [ "$found" -gt 0 ] || { echo "Nessuna app trovata in dist/"; exit 1; }
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: MappeMentali-mac
          path: desktop/dist/*.dmg
          if-no-files-found: error

      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.dmg
