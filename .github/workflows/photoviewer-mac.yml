name: AP PhotoViewer per Mac

on:
  push:
    branches: ['**']
    tags: ['photoviewer-v*']
    paths:
      - 'photoviewer/**'
      - '.github/workflows/photoviewer-mac.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa le dipendenze
        working-directory: photoviewer
        run: npm ci --no-audit --no-fund

      - name: Costruisci l'app (Apple Silicon e Intel)
        working-directory: photoviewer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac

      - name: Firma ad-hoc e crea i file .dmg
        working-directory: photoviewer
        run: |
          set -euo pipefail
          make_dmg() {
            local app="$1" out="$2"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            rm -rf staging && mkdir staging
            cp -R "$app" staging/
            ln -s /Applications staging/Applications
            hdiutil create -volname "AP PhotoViewer" -srcfolder staging -ov -format UDZO "$out"
          }
          shopt -s nullglob
          found=0
          for app in dist/mac*/*.app; do
            case "$(basename "$(dirname "$app")")" in
              *arm64*) name=AppleSilicon ;;
              *) name=Intel ;;
            esac
            make_dmg "$app" "dist/APPhotoViewer-$name.dmg"
            found=$((found + 1))
          done
          [ "$found" -gt 0 ] || { echo "Nessuna app trovata in dist/"; exit 1; }
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: APPhotoViewer-mac
          path: photoviewer/dist/*.dmg
          if-no-files-found: error

      # La release si crea da sola quando le modifiche arrivano su main (o con un tag photoviewer-v*).
      # Il numero di versione viene da photoviewer/package.json.
      - name: Scegli il nome della release
        id: rel
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/photoviewer-v')
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=photoviewer-v$(node -p "require('./photoviewer/package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Pubblica la release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AP PhotoViewer ${{ steps.rel.outputs.tag }}
          files: photoviewer/dist/*.dmg
          body: |
            ## Scarica
            - **APPhotoViewer-AppleSilicon.dmg** → Mac con chip M1, M2, M3, M4…
            - **APPhotoViewer-Intel.dmg** → Mac con processore Intel

            ## Installa
            1. Apri il `.dmg` e trascina **AP PhotoViewer** nella cartella **Applicazioni**.
            2. Al primo avvio macOS blocca l'app (non è firmata con un certificato Apple a pagamento):
               apri **Impostazioni di Sistema → Privacy e sicurezza** e clicca **Apri comunque**.
            3. Dalla volta successiva si apre normalmente.

            In alternativa, da Terminale: `xattr -dr com.apple.quarantine "/Applications/AP PhotoViewer.app"`
